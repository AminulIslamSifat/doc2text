[project]
name = "doc2text"
version = "0.1.0"
description = "PaddleOCR + EasyOCR web app — upload image, get text"
requires-python = ">=3.12"
dependencies = [
    "easyocr>=1.7.0",
    "fastapi>=0.135.0",
    "opencv-python>=4.11.0.86",
    "paddleocr==2.10.0",
    "paddlepaddle==3.2.0",
    "python-multipart>=0.0.9",
    "setuptools>=80.4.0",
    "uvicorn>=0.44.0",
]
