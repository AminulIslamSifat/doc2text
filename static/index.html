<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>doc2text</title>
<style>
  :root {
    --bg: #09090b; --surface: #121216; --border: #27272a;
    --accent: #8b5cf6; --accent-hover: #7c3aed;
    --text: #f4f4f5; --muted: #a1a1aa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 3rem 1.5rem;
  }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.4rem;
       background: linear-gradient(135deg, #c084fc, #8b5cf6);
       -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
  .container { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 1.25rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }

  /* Drop zone */
  .drop-zone {
    min-height: 200px; border: 2px dashed var(--border); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
    padding: 2rem; text-align: center; background: rgba(255,255,255,0.01);
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(139,92,246,0.03); }
  .drop-zone .icon { font-size: 2.5rem; margin-bottom: 0.6rem; color: var(--muted); }
  .drop-zone p { color: var(--muted); font-size: 0.9rem; pointer-events: none; line-height: 1.5; }
  .drop-zone kbd { background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
                   padding: 0.1em 0.4em; font-size: 0.8rem; font-family: inherit; }
  .drop-zone img { max-width: 100%; max-height: 360px; object-fit: contain;
                   position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); border-radius: 6px; }
  .drop-zone input { display: none; }

  /* Controls */
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
  .control-group { display: flex; flex-direction: column; gap: 0.35rem; }
  .control-group label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
                         letter-spacing: 0.05em; color: var(--muted); }
  select, .range-wrap {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.55rem 0.75rem; font-size: 0.85rem; outline: none; width: 100%;
  }
  .range-wrap { display: flex; align-items: center; gap: 0.7rem; }
  .range-wrap input[type=range] { flex: 1; border: none; padding: 0; accent-color: var(--accent); background: transparent; }
  .range-val { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.85rem;
               min-width: 30px; text-align: right; color: var(--accent); }

  .btn {
    width: 100%; margin-top: 1rem; padding: 0.8rem; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .btn:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-sm { width: auto; margin: 0; padding: 0.3rem 0.7rem; font-size: 0.78rem;
            background: transparent; border: 1px solid var(--border); border-radius: 6px; }
  .btn-sm:hover { background: var(--surface); border-color: var(--accent); }

  .spinner-wrap { display: none; align-items: center; justify-content: center; gap: 0.6rem;
                  margin-top: 0.75rem; color: var(--muted); font-size: 0.9rem; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent);
             border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .canvas-wrap { position: relative; width: 100%; overflow: hidden; border-radius: 8px;
                 border: 1px solid var(--border); background: #000; }
  .canvas-wrap canvas { width: 100%; display: block; }

  .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.7rem; }
  .results-header h3 { font-size: 0.95rem; font-weight: 600; }
  .results-list { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.4rem; }
  .results-list::-webkit-scrollbar { width: 5px; }
  .results-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .result-item { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
                 padding: 0.55rem 0.75rem; display: flex; justify-content: space-between;
                 align-items: center; gap: 0.75rem; font-size: 0.85rem; }
  .result-text { word-break: break-word; flex: 1; }
  .result-score { font-size: 0.72rem; background: rgba(139,92,246,0.15); color: #c084fc;
                  padding: 0.15rem 0.4rem; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .empty-state { text-align: center; color: var(--muted); padding: 1.5rem; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>doc2text</h1>
  <p class="subtitle">Paste, drop, or upload an image to extract text</p>

  <div class="container">
    <div class="card">
      <div class="drop-zone" id="dropZone">
        <div class="icon">📋</div>
        <p>Drop image or PDF here, click to upload,<br>or press <kbd>Ctrl+V</kbd> to paste</p>
        <input type="file" id="fileInput" accept="image/*,.pdf,application/pdf">
      </div>

      <div class="controls">
        <div class="control-group">
          <label>Language</label>
          <select id="langSelect">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="devanagari">Devanagari</option>
            <option value="ch">Chinese</option>
            <option value="korean">Korean</option>
            <option value="japan">Japanese</option>
            <option value="ar">Arabic</option>
          </select>
        </div>
        <div class="control-group">
          <label>Confidence</label>
          <div class="range-wrap">
            <input type="range" id="threshold" min="0.1" max="1.0" step="0.05" value="0.8">
            <span class="range-val" id="threshVal">0.80</span>
          </div>
        </div>
      </div>

      <button class="btn" id="runBtn" disabled>Run OCR</button>
      <div class="spinner-wrap" id="spinnerWrap">
        <div class="spinner"></div><span>Extracting text…</span>
      </div>
    </div>

    <div class="card" id="canvasCard" style="display:none">
      <div class="results-header"><h3>Detected Regions</h3></div>
      <div class="canvas-wrap"><canvas id="overlay"></canvas></div>
    </div>

    <div class="card" id="resultsCard" style="display:none">
      <div class="results-header">
        <h3>Extracted Text</h3>
        <button class="btn btn-sm" id="copyBtn">Copy All</button>
      </div>
      <div class="results-list" id="results"></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const dropZone = $('dropZone'), fileInput = $('fileInput'), runBtn = $('runBtn');
const spinnerWrap = $('spinnerWrap'), canvas = $('overlay');
const resultsDiv = $('results'), threshSlider = $('threshold'), threshVal = $('threshVal');
const langSelect = $('langSelect');

let currentFile = null, loadedImage = null;

threshSlider.addEventListener('input', () => {
  threshVal.textContent = parseFloat(threshSlider.value).toFixed(2);
});

// Click to upload
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if (fileInput.files.length) loadFile(fileInput.files[0]); });

// Drag & drop
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  const file = [...e.dataTransfer.files].find(f =>
    f.type.startsWith('image/') || f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf')
  );
  if (file) loadFile(file);
});

// Paste from clipboard
document.addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      loadFile(item.getAsFile());
      return;
    }
  }
});

function isPdf(file) {
  return file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
}

function loadFile(file) {
  currentFile = file;
  // Remove old preview
  const oldImg = dropZone.querySelector('img');
  if (oldImg) oldImg.remove();
  const oldInfo = dropZone.querySelector('.file-info');
  if (oldInfo) oldInfo.remove();

  if (isPdf(file)) {
    loadedImage = null;
    dropZone.querySelector('.icon').style.display = 'none';
    dropZone.querySelector('p').style.display = 'none';
    const info = document.createElement('div');
    info.className = 'file-info';
    info.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;';
    info.innerHTML = `<div style="font-size:3rem;margin-bottom:0.5rem">📄</div><div style="font-size:0.9rem;color:var(--muted)">${esc(file.name)}</div>`;
    dropZone.appendChild(info);
    runBtn.disabled = false;
  } else {
    const reader = new FileReader();
    reader.onload = e => {
      dropZone.querySelector('.icon').style.display = 'none';
      dropZone.querySelector('p').style.display = 'none';
      let img = dropZone.querySelector('img');
      if (!img) { img = document.createElement('img'); dropZone.appendChild(img); }
      img.src = e.target.result;
      loadedImage = new Image();
      loadedImage.onload = () => { runBtn.disabled = false; };
      loadedImage.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}

runBtn.addEventListener('click', async () => {
  if (!currentFile) return;
  runBtn.disabled = true;
  spinnerWrap.style.display = 'flex';
  $('canvasCard').style.display = 'none';
  $('resultsCard').style.display = 'none';

  const form = new FormData();
  form.append('image', currentFile);
  const params = new URLSearchParams({
    threshold: threshSlider.value, lang: langSelect.value, engine: 'paddle'
  });

  try {
    const res = await fetch(`/api/ocr?${params}`, { method: 'POST', body: form });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    if (data.type === 'pdf') {
      showPdfResults(data.pages);
    } else {
      drawOverlay(data.results);
      showResults(data.results);
    }
  } catch (err) {
    alert('Request failed: ' + err.message);
  } finally {
    spinnerWrap.style.display = 'none';
    runBtn.disabled = false;
  }
});

$('copyBtn').addEventListener('click', () => {
  const text = Array.from(resultsDiv.querySelectorAll('.result-text'))
    .map(el => el.textContent).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = $('copyBtn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy All', 2000);
  });
});

function drawOverlay(results) {
  if (!loadedImage || !results.length) return;
  canvas.width = loadedImage.naturalWidth;
  canvas.height = loadedImage.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(loadedImage, 0, 0);
  ctx.strokeStyle = '#8b5cf6';
  ctx.lineWidth = Math.max(2, Math.round(loadedImage.naturalWidth / 300));
  for (const item of results) {
    const [x1, y1, x2, y2] = item.box;
    ctx.fillStyle = 'rgba(139,92,246,0.15)';
    ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
  }
  $('canvasCard').style.display = 'block';
}

function showResults(results) {
  if (!results.length) {
    resultsDiv.innerHTML = '<div class="empty-state">No text detected.</div>';
  } else {
    resultsDiv.innerHTML = results.map(r =>
      `<div class="result-item"><span class="result-text">${esc(r.text)}</span><span class="result-score">${(r.score * 100).toFixed(1)}%</span></div>`
    ).join('');
  }
  $('resultsCard').style.display = 'block';
}

function showPdfResults(pages) {
  $('canvasCard').style.display = 'none'; // no overlay for PDFs
  if (!pages || !pages.length) {
    resultsDiv.innerHTML = '<div class="empty-state">No text detected in PDF.</div>';
    $('resultsCard').style.display = 'block';
    return;
  }
  let html = '';
  for (const page of pages) {
    html += `<div style="margin-bottom:0.3rem"><span style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--accent)">Page ${page.page}</span>`;
    if (page.error) html += ` <span style="font-size:0.75rem;color:#f87171">— ${esc(page.error)}</span>`;
    html += `</div>`;
    if (page.results.length === 0 && !page.error) {
      html += '<div class="result-item" style="color:var(--muted);font-style:italic">No text detected</div>';
    }
    for (const r of page.results) {
      html += `<div class="result-item"><span class="result-text">${esc(r.text)}</span><span class="result-score">${(r.score * 100).toFixed(1)}%</span></div>`;
    }
  }
  resultsDiv.innerHTML = html;
  $('resultsCard').style.display = 'block';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
